services:
  tempo:
    image: grafana/tempo:2.4.1
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/config.yaml:ro
      - tempo-data:/tmp/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage

  # Step 4 (pro tip): provisionar el datasource de Tempo en Grafana
  grafana:
    volumes:
      - ./tempo/grafana-tempo-datasource.yml:/etc/grafana/provisioning/datasources/tempo.yml:ro

  otel-collector:
    depends_on:
      - tempo

volumes:
  tempo-data:
