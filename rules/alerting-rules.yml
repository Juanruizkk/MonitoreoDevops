groups:
  - name: http_alerts
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: |
          sum(rate(app_http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(app_http_requests_total[5m]))
          > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook_url: "https://wiki.example.com/runbooks/high-error-rate"

      # Elevated error rate warning
      - alert: ElevatedErrorRate
        expr: |
          sum(rate(app_http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(app_http_requests_total[5m]))
          > 0.01
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Elevated error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      # No requests at all (service might be down)
      - alert: NoRequestsReceived
        expr: sum(rate(app_http_requests_total[5m])) == 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "No requests received by the application"
          description: "demo-app has received zero requests for 5 minutes"

  - name: latency_alerts
    rules:
      # P99 latency too high
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(app_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 3m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "P99 latency exceeds 1 second"
          description: "P99 latency is {{ $value | humanizeDuration }} (threshold: 1s)"
          runbook_url: "https://wiki.example.com/runbooks/high-latency"

      # P50 latency elevated
      - alert: ElevatedP50Latency
        expr: |
          histogram_quantile(0.50,
            sum(rate(app_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Median latency exceeds 500ms"
          description: "P50 latency is {{ $value | humanizeDuration }}"

  - name: endpoint_alerts
    rules:
      # Blackbox probe failure
      - alert: EndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "Blackbox probe has failed for {{ $labels.instance }} for more than 1 minute"

      # SSL certificate expiring soon
      - alert: SSLCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SSL cert for {{ $labels.instance }} expires in {{ $value | humanize }} days"
          description: "Certificate will expire within 30 days — renew immediately"
