groups:
  - name: golden_signals
    interval: 10s
    rules:
      # Error rate > 10%
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(app_http_requests_total{status_code=~"5.."}[2m]))
            /
            sum(rate(app_http_requests_total[2m]))
          ) > 0.10
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 2 minutes."

      # P95 latency > 500ms
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(app_http_request_duration_seconds_bucket[2m])) by (le)
          ) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency detected"
          description: "P95 latency is {{ $value }}s over the last 2 minutes."

      # Memory leak alert
      - alert: HighMemoryUsage
        expr: |
          max(app_memory_leak_bytes) > 200 * 1024 * 1024
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on demo-app"
          description: "Leak gauge is {{ $value | humanize1024 }}B."
